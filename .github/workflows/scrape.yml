name: Scrape events

on:
  schedule:
    # 06:00 UTC = 09:00 Israel (IDT/summer). Cron is fixed UTC — no DST
    # awareness — so this runs at 10:00 Israel during IST/winter (~late Oct
    # to late Mar). One scrape a day to keep Anthropic API cost down.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev   # puppeteer-core (uses the runner's preinstalled Chrome)
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scraper/index.js
      - name: Health check (QA)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scraper/check.js
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-errors
          path: artifacts/
          if-no-files-found: ignore
