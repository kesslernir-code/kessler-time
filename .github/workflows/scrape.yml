name: Scrape events

on:
  schedule:
    # UTC: 04:00 / 10:00 / 16:00 = 07:00 / 13:00 / 19:00 Israel (summer)
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev   # puppeteer-core (uses the runner's preinstalled Chrome)
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scraper/index.js
      - name: Run social discovery
        # Apify free tier is ~$5/mo and each search run is ~$0.30, so run only
        # twice a week (Sun & Wed) — or any manual run. Telegram is free.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          DOW=$(date -u +%u)   # 1=Mon .. 7=Sun
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$DOW" = "7" ] || [ "$DOW" = "3" ]; then
            node scraper/discover.js
          else
            echo "skipping discovery today (runs Sun & Wed to stay within Apify free tier)"
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-errors
          path: artifacts/
          if-no-files-found: ignore
